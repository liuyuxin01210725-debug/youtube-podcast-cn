<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中文播客工作台</title><link rel="stylesheet" href="/style.css"><body><aside><div class="brand">声间<span>中文播客工作台</span></div><button id="new" class="primary">＋ 新建任务</button><div class="side-label">我的音频</div><div id="jobs"></div><footer>本机工作空间<br>语音样本与成品保存在本机</footer></aside><main><header><span>LOCAL AUDIO STUDIO</span><span class="local">● 本机运行</span></header><div id="notice" role="status"></div><section id="create"><div class="eyebrow">听见另一种语言</div><h1>把英文对话，<br>带进中文世界。</h1><p class="intro">保留完整内容，按说话人生成中文音频。先校对译稿，再试听与导出。验收：音色数等于真实人数，且逐人可辨。</p><div class="card"><label for="urls">YouTube 链接 <small>每行一个，可批量添加</small></label><textarea id="urls" rows="3" placeholder="https://www.youtube.com/watch?v=…"></textarea><div class="divider">或导入已有文件</div><label class="upload" for="files">选择音频或视频<input aria-label="选择本地音频或视频" id="files" type="file" multiple accept="audio/*,video/*,.txt,.md,text/plain"><span id="filenames">支持 MP3、WAV、M4A、MP4 等 · 单文件最多 2 GB</span></label><div class="settings"><label>中文声音<select id="tts"><option value="edge" selected>可辨音色 · 默认（系统声槽）</option><option value="clone">原声克隆 · 可选本地模型</option></select></label><label>翻译服务<select id="provider"><option value="deepseek">DeepSeek</option><option value="qwen">通义千问</option></select></label></div><div class="settings"><label>节目形式<select id="content-type"><option value="conversation">对谈 · 默认 2 人</option><option value="monologue">单口 · 默认 1 人</option><option value="book">书 · 1 位朗读者</option></select></label><label>真实说话人数<input id="expected-speakers" type="number" min="1" max="5" value="2"></label></div><div class="create-actions"><button id="prepare" class="primary">准备译稿 →</button><button id="full">直接生成完整音频</button></div><p class="hint">任务逐个处理。翻译需要联网及已配置的服务密钥，可能产生费用。首次本地模型处理较慢。YouTube 受限时，可导入已下载文件。</p></div></section><section id="workspace" hidden></section></main><script src="/app.js"></script></body></html>
